<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD Collection Manager</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --primary-color: #3498db;
            --danger-color: #e74c3c;
            --header-bg: #111111;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            padding-top: 100px;
            min-height: 100vh;
        }
        .header-container {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1200px;
            background-color: var(--header-bg);
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 1000;
            border: 1px solid #333;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .disc-icon {
            width: 24px; height: 24px; background-color: var(--primary-color);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-weight: bold; font-size: 12px;
        }
        .collection-title { font-size: 16px; font-weight: 600; }
        .search-wrapper { position: relative; flex: 1; max-width: 400px; margin: 0 20px; }
        .search-bar {
            width: 100%; padding: 8px 35px 8px 15px; border-radius: 20px;
            border: 1px solid #444; background-color: #222; color: #fff;
            font-size: 14px; outline: none;
        }
        .clear-search {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: var(--text-muted); font-size: 18px; display: none; font-weight: bold;
        }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .toggle-btn {
            background-color: var(--card-bg); border: 1px solid #444; color: #fff;
            padding: 6px 14px; border-radius: 15px; cursor: pointer; font-size: 13px;
        }
        .toggle-btn.active { background-color: var(--primary-color); border-color: var(--primary-color); }
        .main-container { max-width: 1200px; margin: 0 auto; width: 100%; }
        .list-view { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .list-view th, .list-view td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        .list-view th { color: var(--text-muted); font-weight: 500; font-size: 14px; }
        .list-view tr { cursor: pointer; transition: background 0.2s; }
        .list-view tr:hover { background-color: var(--card-bg); }
        .grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; margin-top: 10px; display: none; }
        .grid-card { background-color: var(--card-bg); padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #333; }
        .grid-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .grid-art-placeholder { width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, #444, #222); border-radius: 8px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #555; object-fit: cover; }
        .grid-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .grid-artist { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background-color: #222; border-radius: 16px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; border: 1px solid #444; position: relative; }
        .modal-header { background-color: var(--header-bg); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10; }
        .close-btn { background-color: var(--danger-color); color: white; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .modal-body { padding: 20px; }
        .modal-art { width: 180px; height: 180px; background: linear-gradient(135deg, #444, #222); border-radius: 10px; margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center; font-size: 60px; color: #555; object-fit: cover; }
        .meta-row { margin-bottom: 8px; font-size: 14px; }
        .meta-label { font-weight: bold; color: var(--text-muted); }
        .discogs-btn { display: inline-block; background-color: #34495e; color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; margin-top: 10px; margin-bottom: 20px; text-align: center; width: 100%; font-weight: 600; }
        .tracklist-header { font-size: 15px; font-weight: 600; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .track-box { font-family: monospace; background-color: #111; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; color: #2ecc71; max-height: 200px; overflow-y: auto; }
        .back-to-top { position: fixed; bottom: 25px; right: 25px; width: 45px; height: 45px; background-color: var(--primary-color); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; opacity: 0; transition: opacity 0.3s; z-index: 999; border: none; }
        .back-to-top.visible { opacity: 1; }
        .no-data { text-align: center; padding: 40px; color: var(--text-muted); font-size: 16px; }
    </style>
</head>
<body>
    <div class="header-container">
        <div class="header-left">
            <div class="disc-icon">💿</div>
            <div class="collection-title" id="collectionCount">Active Collection (0 Albums)</div>
        </div>
        <div class="search-wrapper">
            <input type="text" class="search-bar" id="searchBar" placeholder="Search artist, title, keywords...">
            <span class="clear-search" id="clearSearch">×</span>
        </div>
        <div class="header-right">
            <button class="toggle-btn active" id="listToggle">List View</button>
            <button class="toggle-btn" id="gridToggle">Grid View</button>
        </div>
    </div>
    <div class="main-container">
        <table class="list-view" id="listView">
            <thead><tr><th>Artist</th><th>Album Title</th><th>Keywords / Catalog</th><th>Location</th></tr></thead>
            <tbody id="listBody"></tbody>
        </table>
        <div class="grid-view" id="gridView"></div>
        <div id="noDataMessage" class="no-data" style="display: none;">No matching albums found.</div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-headline" id="modalHeadline">Album Details</div>
                <button class="close-btn" id="closeModal">Close Card</button>
            </div>
            <div class="modal-body">
                <img id="modalArt" class="modal-art" src="" alt="💿" onerror="this.style.display='none';">
                <div id="modalArtFallback" class="modal-art" style="display:none;">💿</div>
                <div class="meta-row"><span class="meta-label">Released:</span> <span id="modalReleased"></span></div>
                <div class="meta-row"><span class="meta-label">Length:</span> <span id="modalLength"></span></div>
                <div class="meta-row"><span class="meta-label">Label:</span> <span id="modalLabel"></span></div>
                <a href="#" target="_blank" class="discogs-btn" id="modalDiscogs">View Release Trends on Discogs</a>
                <div class="tracklist-header">Track Listing</div>
                <div class="track-box" id="modalTracks"></div>
            </div>
        </div>
    </div>
    <button class="back-to-top" id="backToTop">↑</button>
    <script>
        const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzASZcZBBRcoDudHNGrv1YMXo7MXVlsZfg4WhiP8BUcTkisEVf6PLhOf8VWZCbSPc_T/exec";

        const GOOGLE_SHEET_API_URL = "https://google.com";

        let allAlbums = [];
        const listBody = document.getElementById('listBody');
        const gridView = document.getElementById('gridView');
        const listView = document.getElementById('listView');
        const searchBar = document.getElementById('searchBar');
        const clearSearch = document.getElementById('clearSearch');
        const collectionCount = document.getElementById('collectionCount');
        const listToggle = document.getElementById('listToggle');
        const gridToggle = document.getElementById('gridToggle');
        const backToTop = document.getElementById('backToTop');
        const noDataMessage = document.getElementById('noDataMessage');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalHeadline = document.getElementById('modalHeadline');
        const modalArt = document.getElementById('modalArt');
        const modalArtFallback = document.getElementById('modalArtFallback');
        const modalReleased = document.getElementById('modalReleased');
        const modalLength = document.getElementById('modalLength');
        const modalLabel = document.getElementById('modalLabel');
        const modalDiscogs = document.getElementById('modalDiscogs');
        const modalTracks = document.getElementById('modalTracks');
        const closeModal = document.getElementById('closeModal');

        async function fetchCollection() {
            try {
                collectionCount.innerText = "Loading Live Rows...";
                
                const script = document.createElement('script');
                script.src = GOOGLE_SHEET_API_URL + "?callback=handleJSONPResponse";
                
                window.handleJSONPResponse = function(data) {
                    allAlbums = data;
                    renderData(allAlbums);
                    delete window.handleJSONPResponse;
                    document.body.removeChild(script);
                };
                
                script.onerror = function() {
                    collectionCount.innerText = "Connection Error";
                };
                
                document.body.appendChild(script);
            } catch (err) {
                collectionCount.innerText = "Connection Error";
                console.error("Payload Sync Exception:", err);
            }
        }

        function renderData(data) {
            collectionCount.innerText = "Active Collection (" + data.length + " Albums)";
            listBody.innerHTML = ''; 
            gridView.innerHTML = '';
            
            if (!data || data.length === 0) { 
                noDataMessage.style.display = 'block'; 
                return; 
            }
            noDataMessage.style.display = 'none';
            
            data.forEach(album => {
                // 📡 UNIVERSAL ALIGNMENT WRAPPER: Maps both upper and lowercase keys cleanly!
                const artist = album.artist || album.Artist || "Unknown Artist";
                const title = album.title || album.Title || "Untitled";
                const keywords = album.keywords || album.Keywords || "";
                const location = album.location || album.Location || "";
                const artwork = album.artwork || album.Artwork || "";

                // 📋 RENDER LIST ROW
                const tr = document.createElement('tr');
                tr.innerHTML = "<td><b>" + artist + "</b></td><td>" + title + "</td><td style='color:#aaa;'>" + keywords + "</td><td>" + location + "</td>";
                tr.addEventListener('click', () => openAlbumModal(album));
                listBody.appendChild(tr);

                // 🎴 RENDER CARD MATRIX
                const card = document.createElement('div'); 
                card.className = 'grid-card';
                const hasArt = artwork && artwork.toLowerCase().startsWith('http');
                card.innerHTML = (hasArt ? "<img class='grid-art-placeholder' src='" + artwork + "'>" : "<div class='grid-art-placeholder'>💿</div>") + "<div class='grid-title'>" + title + "</div><div class='grid-artist'>" + artist + "</div>";
                card.addEventListener('click', () => openAlbumModal(album));
                gridView.appendChild(card);
            });
        }

        function openAlbumModal(album) {
            const artist = album.artist || album.Artist || "Unknown Artist";
            const title = album.title || album.Title || "Untitled";
            const releaseDate = album.releaseDate || album.ReleaseDate || 'N/A';
            const length = album.length || album.Length || 'N/A';
            const label = album.label || album.Label || 'N/A';
            const tracks = album.tracks || album.Tracks || '';
            const artwork = album.artwork || album.Artwork || '';

            modalHeadline.innerText = artist + " - " + title;
            modalReleased.innerText = releaseDate;
            modalLength.innerText = length;
            modalLabel.innerText = label;
            modalTracks.innerText = tracks ? tracks.replace(/\\n/g, '\n') : 'No tracks listed.';
            modalDiscogs.href = "https://discogs.com" + encodeURIComponent(artist + " " + title) + "&type=release";
            
            const hasArt = artwork && artwork.toLowerCase().startsWith('http');
            if(hasArt) { 
                modalArt.src = artwork; 
                modalArt.style.display = 'block'; 
                modalArtFallback.style.display = 'none'; 
            } else { 
                modalArt.style.display = 'none'; 
                modalArtFallback.style.display = 'flex'; 
            }
            modalOverlay.classList.add('active');
        }

        closeModal.addEventListener('click', () => modalOverlay.classList.remove('active'));
        modalOverlay.addEventListener('click', (e) => { 
            if(e.target === modalOverlay) modalOverlay.classList.remove('active'); 
        });

        searchBar.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if(query) {
                clearSearch.style.display = 'block';
                const filtered = allAlbums.filter(a => {
                    const rArtist = (a.artist || a.Artist || "").toLowerCase();
                    const rTitle = (a.title || a.Title || "").toLowerCase();
                    const rKeywords = (a.keywords || a.Keywords || "").toLowerCase();
                    return rArtist.includes(query) || rTitle.includes(query) || rKeywords.includes(query);
                });
                renderData(filtered);
            } else { 
                clearSearch.style.display = 'none'; 
                renderData(allAlbums); 
            }
        });
        
        clearSearch.addEventListener('click', () => { 
            searchBar.value = ''; 
            clearSearch.style.display = 'none'; 
            renderData(allAlbums); 
        });

        listToggle.addEventListener('click', () => { 
            listToggle.className = 'toggle-btn active'; 
            gridToggle.className = 'toggle-btn'; 
            listView.style.display = 'table'; 
            gridView.style.display = 'none'; 
        });
        
        gridToggle.addEventListener('click', () => { 
            gridToggle.className = 'toggle-btn active'; 
            listToggle.className = 'toggle-btn'; 
            gridView.style.display = 'grid'; 
            listView.style.display = 'none'; 
        });

        window.addEventListener('scroll', () => { 
            if(window.scrollY > 150) backToTop.classList.add('visible'); 
            else backToTop.classList.remove('visible'); 
        });
        backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

        fetchCollection();
